# Veröffentlicht die Webseite auf GitHub Pages (Einstellungen → Pages → Source: "GitHub Actions").
# Inhalt der Seite: der Ordner website/ (MIDI-Chart als Startseite, Sitemap) plus die Mixerseite zum Ausprobieren ohne Download.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r website/. _site/
          cp flow8-mixer-ble.html _site/
          cp -r images languages _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
